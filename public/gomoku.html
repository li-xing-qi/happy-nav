<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>五子棋 · 和鱼的开心导航 v5.001</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ink:#141414; --ink-2:#5c5c5c; --ink-3:#9a9a9a;
    --line:#e8e6e2; --line-2:#d8d5cf; --grid:#dcd9d2;
    --paper:#ffffff; --paper-2:#f7f6f3; --paper-3:#efeeea;
    --accent:#1f7a6a; --accent-soft:#e8f6f2; --grad:linear-gradient(135deg,#f1fbf8 0%,#ffffff 72%);
    --seal:var(--accent); --black:#1c1c1c; --white:#ffffff;
    --r:14px;
  }
  html,body{height:100%;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  .serif{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;}
  .seal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;
    background:var(--seal);color:#fff;font-size:12px;font-weight:700;font-family:"Songti SC",serif;}

  /* ================= 进门 ================= */
  #join{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    background:var(--paper);overflow-y:auto;}
  .jcard{width:min(380px,100%);}
  .jbrand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;letter-spacing:.08em;}
  .jlead{margin-top:10px;font-size:13px;line-height:1.85;color:var(--ink-2);}
  .jlabel{margin:20px 0 7px;font-size:11px;letter-spacing:.2em;color:var(--ink-3);}
  .jinput{width:100%;padding:13px 14px;border:1px solid var(--line-2);border-radius:11px;background:#fff;
    font-size:15px;color:var(--ink);outline:none;transition:border-color .15s;}
  .jinput:focus{border-color:var(--ink);}
  #roomIn{letter-spacing:.24em;font-weight:700;text-transform:uppercase;}
  .jbtn{margin-top:22px;width:100%;padding:14px;border:none;border-radius:11px;background:var(--ink);
    color:#fff;font-size:15px;font-weight:600;letter-spacing:.06em;transition:opacity .15s,transform .1s;}
  .jbtn:hover{opacity:.9;}
  .jbtn:active{transform:scale(.99);}
  .jbtn:disabled{opacity:.45;cursor:default;}
  .jrow{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .jlink{background:none;border:none;padding:0;font-size:12.5px;color:var(--ink-2);text-decoration:none;letter-spacing:.04em;}
  .jlink:hover{color:var(--ink);}
  .jmsg{margin-top:14px;font-size:12.5px;line-height:1.7;color:var(--seal);min-height:18px;}
  .jmsg.ok{color:#2f7a4e;}

  /* ================= 对局 ================= */
  #room{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);}
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:10px;padding-left:14px;padding-right:14px;
    border-bottom:1px solid var(--line);
  }
  .back{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:15px;}
  .back:hover{background:var(--paper-2);}
  .rmeta{flex:1 1 auto;min-width:0;}
  .rname{font-size:14px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:7px;}
  .rname b{font-variant-numeric:tabular-nums;letter-spacing:.16em;}
  .rsub{font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;align-items:center;gap:5px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#cfcfcf;flex:0 0 auto;}
  .dot.on{background:#3ec06a;box-shadow:0 0 0 3px rgba(62,192,106,.16);}
  .hbtn{width:34px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-2);transition:background .14s,color .14s;}
  .hbtn:hover{background:var(--paper-2);color:var(--ink);}
  .hbtn.off{color:var(--ink-3);}
  .hbtn.on{color:var(--seal);}

  /* 主体：桌面左右分栏，手机上下 */
  .play{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);min-height:0;overflow:auto;}
  .board-wrap{width:min(92vw,560px);flex:0 0 auto;}
  .board{position:relative;width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--line-2);
    border-radius:12px;box-shadow:0 14px 40px rgba(20,20,20,.07);}
  .grid{position:absolute;inset:4.2%;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);}
  .grid .cell{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);position:relative;}
  .grid .cell:nth-child(15n){border-right:none;}
  .grid .cell:nth-child(n+211){border-bottom:none;}
  .grid .cell.star::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;
    background:var(--grid);transform:translate(-50%,-50%);}
  .grid .cell.hot{background:rgba(178,58,47,.05);}
  .grid.clickable{cursor:pointer;}
  .stone{position:absolute;width:6.2%;height:6.2%;border-radius:50%;transform:translate(-50%,-50%);
    pointer-events:none;transition:box-shadow .15s;}
  .stone.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,var(--black) 70%);box-shadow:0 2px 5px rgba(0,0,0,.35);}
  .stone.w{background:radial-gradient(circle at 35% 30%,#ffffff,#e9e7e2 78%);border:1.5px solid #b9b4a9;
    box-shadow:0 2px 5px rgba(0,0,0,.2);}
  .stone.last::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--seal);opacity:.9;}
  .stone.win::after{content:'';position:absolute;inset:2px;border-radius:50%;border:2px solid var(--seal);}

  /* 侧栏 / 状态条 */
  .panel{width:min(92vw,560px);flex:0 0 auto;display:flex;flex-direction:column;gap:12px;}
  .status{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);}
  .turn{width:30px;height:30px;border-radius:50%;flex:0 0 auto;}
  .turn.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,var(--black) 70%);}
  .turn.w{background:radial-gradient(circle at 35% 30%,#ffffff,#e9e7e2 78%);border:1.5px solid #b9b4a9;}
  .stxt{flex:1 1 auto;min-width:0;}
  .stxt .s1{font-size:14.5px;font-weight:700;letter-spacing:.02em;}
  .stxt .s2{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .result{color:var(--seal);}
  .meta{display:flex;gap:10px;flex-wrap:wrap;}
  .chip{font-size:12px;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line);
    padding:6px 11px;border-radius:99px;display:flex;align-items:center;gap:6px;}
  .chip b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;}
  .me-chip{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px;}
  .mini{width:16px;height:16px;border-radius:50%;}
  .mini.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,var(--black) 70%);}
  .mini.w{background:radial-gradient(circle at 35% 30%,#ffffff,#e9e7e2 78%);border:1.5px solid #b9b4a9;}
  .actions{display:flex;gap:10px;}
  .btn{flex:1 1 auto;padding:12px;border:1px solid var(--line-2);border-radius:11px;background:#fff;color:var(--ink);
    font-size:14px;font-weight:600;letter-spacing:.04em;transition:background .14s,opacity .14s;}
  .btn:hover{background:var(--paper-2);}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.primary:hover{opacity:.9;}
  .btn:disabled{opacity:.4;cursor:default;}
  .hint{font-size:11.5px;line-height:1.7;color:var(--ink-3);}

  /* 悔棋待确认 */
  .undobar{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line-2);border-radius:12px;
    background:var(--paper-2);font-size:12.5px;line-height:1.5;color:var(--ink-2);}
  .undobar .ubtn{flex:0 0 auto;padding:6px 12px;border:1px solid var(--line-2);border-radius:9px;background:#fff;
    font-size:12px;font-weight:600;color:var(--ink);}
  .undobar .ubtn:hover{background:var(--paper-3);}

  /* 胜利界面（停留在盘面，不自动开下一局） */
  .victory{border:1px solid var(--line-2);border-radius:14px;background:var(--paper);padding:14px;
    display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(20,20,20,.06);}
  .vtitle{font-size:20px;font-weight:700;letter-spacing:.02em;color:var(--ink);}
  .vtitle.win{color:var(--seal);}
  .vsub{font-size:12px;color:var(--ink-3);}
  .vready{display:flex;gap:8px;}
  .vpill{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;padding:8px 9px;border:1px solid var(--line);
    border-radius:9px;background:var(--paper-2);font-size:11.5px;color:var(--ink-2);}
  .vpill.on{border-color:var(--ink);background:#fff;color:var(--ink);}
  .vpill .vd{width:6px;height:6px;border-radius:50%;background:#cfcfcf;flex:0 0 auto;}
  .vpill.on .vd{background:#3ec06a;box-shadow:0 0 0 3px rgba(62,192,106,.16);}
  .vpill b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vpill em{margin-left:auto;flex:0 0 auto;font-style:normal;font-size:11px;color:var(--ink-3);}
  .vpill.on em{color:#2f7a4e;}
  .vvol{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-3);}
  .vvol input[type=range]{flex:1 1 auto;min-width:0;height:18px;accent-color:var(--seal);}
  .vvol span{font-variant-numeric:tabular-nums;}
  .vhint{font-size:11px;line-height:1.6;color:var(--ink-3);}

  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);
    z-index:120;background:rgba(20,20,20,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;
    max-width:86vw;text-align:center;line-height:1.5;}

  /* 身份 / 头像 */
  .ident{display:flex;gap:10px;}
  .av{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;transition:border-color .14s,background .14s;}
  .av:hover{border-color:var(--line-2);background:var(--paper-2);}
  .av.me{border-color:var(--ink);}
  .av-face{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background:var(--ink-3);}
  .av-face.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,var(--black) 70%);}
  .av-face.w{background:radial-gradient(circle at 35% 30%,#ffffff,#e3e1db 80%);color:var(--ink);border:1.5px solid #b9b4a9;}
  .av-name{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .av-role{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;}
  .av-role.host{color:var(--seal);}
  .idline{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:-2px;}

  /* 规则 */
  .rule{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;}
  .rule-title{font-size:12px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:9px;}
  .rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .rbtn{padding:10px 6px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;transition:background .14s,border-color .14s;}
  .rbtn:hover{background:var(--paper-2);}
  .rbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .rule-locked{font-size:13px;line-height:1.7;color:var(--ink-2);}
  .rule-locked b{color:var(--ink);}
  .rule-member{font-size:13px;line-height:1.8;color:var(--ink-2);}
  .rule-member .now{color:var(--ink);font-weight:700;}
  .rule-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .actbtn{padding:9px;border:1px solid var(--line-2);border-radius:10px;background:#fff;font-size:12.5px;font-weight:600;color:var(--ink);transition:background .14s;}
  .actbtn:hover{background:var(--paper-2);}
  .actbtn:disabled{opacity:.45;cursor:default;}

  /* 聊天 */
  .chat{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .chat-title{font-size:12px;letter-spacing:.12em;color:var(--ink-3);}
  .chat-log{flex:1 1 auto;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:4px 2px;}
  .msg{font-size:12.5px;line-height:1.5;max-width:88%;padding:6px 10px;border-radius:11px;word-break:break-word;}
  .msg.them{background:var(--paper-3);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.me{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .msg .who{font-size:10px;opacity:.65;margin-right:5px;}
  .chat-input{display:flex;gap:7px;}
  .chat-input input{flex:1 1 auto;min-width:0;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;font-size:13px;outline:none;}
  .chat-input input:focus{border-color:var(--ink);}
  .chat-input button{padding:0 14px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;flex:0 0 auto;}

  /* 日志面板 */
  .logtoggle{flex:0 0 auto;width:100%;text-align:left;color:var(--ink-2);font-weight:600;font-size:13px;background:#fff;}
  .logpanel{border:1px solid var(--line);border-radius:12px;background:var(--paper-2);padding:12px;font-size:12px;color:var(--ink-2);max-height:220px;overflow-y:auto;}
  .logpanel h4{font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin:0 0 7px;}
  .logpanel .lsum{margin-bottom:9px;line-height:1.7;}
  .logrow{display:flex;align-items:center;gap:7px;padding:3px 0;border-bottom:1px dashed var(--line);}
  .logrow:last-child{border-bottom:none;}
  .logsdot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;}
  .logsdot.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,var(--black) 70%);}
  .logsdot.w{background:radial-gradient(circle at 35% 30%,#fff,#e3e1db 80%);border:1.4px solid #b9b4a9;}

  /* 弹窗 / 猜拳 */
  .modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(20,20,20,.4);padding:20px;}
  .mbox{width:min(320px,100%);background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .mbox h3{font-size:15px;font-weight:700;margin-bottom:6px;}
  .mbox p{font-size:13px;color:var(--ink-2);line-height:1.7;margin-bottom:16px;}
  .mrow{display:flex;gap:10px;}
  .rps-row{display:flex;gap:10px;justify-content:center;margin:14px 0;}
  .rps{flex:1 1 0;padding:14px 0;border:1px solid var(--line-2);border-radius:12px;background:#fff;font-size:22px;text-align:center;transition:background .14s,border-color .14s;}
  .rps:hover{background:var(--paper-2);}
  .rps.sel{background:var(--ink);color:#fff;border-color:var(--ink);}
  .rps.wait{opacity:.5;}

  @media(max-width:820px){
    .play{gap:12px;justify-content:flex-start;padding-top:16px;}
    .hint{display:none;}
    .chat-log{max-height:110px;}
  }
  @media(min-width:821px){
    .play{flex-direction:row;align-items:flex-start;justify-content:center;gap:26px;}
    .panel{width:240px;align-self:stretch;justify-content:center;}
  }
</style>
<style>
/* ============================================================
   v5 · 五子棋「设置 · 场景与棋盘」增量层
   · 顶栏新增 ⚙ 设置按钮（脚本注入）
   · 5 套场景 + 5 种棋盘材质 + 3 档网格深浅，全部本地记忆
   · 原有棋局逻辑 / 动效 / 音乐一行未改
   ============================================================ */
.goset-btn{font-size:14px;}
.goset-mask{position:fixed;inset:0;background:rgba(15,22,24,.34);z-index:80;}
.goset-panel{position:fixed;z-index:81;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(400px,calc(100vw - 28px));max-height:min(86vh,660px);overflow-y:auto;
  background:#fff;color:#1b2328;border:1px solid #e6e9e8;border-radius:16px;padding:18px;
  box-shadow:0 24px 70px rgba(10,25,30,.26);animation:gosetIn .22s ease both;}
@keyframes gosetIn{from{opacity:0;transform:translate(-50%,-46%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.goset-h{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.goset-h h2{font-size:15px;letter-spacing:.05em;}
.goset-h .x{margin-left:auto;width:30px;height:30px;border:1px solid #ececec;border-radius:9px;
  background:#fff;color:#666;font-size:13px;}
.goset-h .x:hover{background:#fafafa;color:#111;}
.goset-sub{font-size:11.5px;color:#8b9599;line-height:1.7;margin-bottom:8px;}
.goset-row{padding:13px 0;border-bottom:1px solid #f0f2f1;}
.goset-row:last-of-type{border-bottom:none;}
.goset-row>label{display:block;font-size:12.5px;font-weight:700;color:#26343a;margin-bottom:2px;}
.goset-row>label small{display:block;font-size:10.5px;font-weight:400;color:#98a3a6;margin-top:3px;line-height:1.6;}
.goset-opts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px;}
.goset-opt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 3px;border:1px solid #e6eae9;
  border-radius:10px;background:#fff;font-size:10.5px;color:#5e6a6e;transition:border-color .16s,transform .16s,box-shadow .16s;}
.goset-opt:hover{transform:translateY(-2px);border-color:#b8c9c6;}
.goset-opt[aria-pressed="true"]{border-color:#1f7a6a;color:#1f7a6a;font-weight:700;
  box-shadow:0 0 0 2px rgba(31,122,106,.12);}
.goset-opt .sw{width:100%;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.06);}
.goset-line{display:flex;gap:7px;margin-top:10px;}
.goset-line button{flex:1 1 auto;padding:8px 6px;border:1px solid #e6eae9;border-radius:9px;background:#fff;
  font-size:11.5px;color:#5e6a6e;}
.goset-line button[aria-pressed="true"]{border-color:#1f7a6a;color:#1f7a6a;font-weight:700;background:#f0f8f6;}
.goset-note{font-size:10.5px;color:#9aa4a7;line-height:1.75;margin-top:10px;}
.goset-done{margin-top:14px;width:100%;padding:11px;border:0;border-radius:10px;background:#1f7a6a;color:#fff;
  font-size:13.5px;font-weight:600;letter-spacing:.05em;}

/* ---------- 场景：换纸张底色与背景纹理 ---------- */
html[data-go-scene="paper"]{--paper:#fbf7ef;--line:#ece3d5;--line-2:#ddd0bb;--grid:#d9cbb2;}
html[data-go-scene="bamboo"]{--paper:#f2f7ef;--line:#dce9dc;--line-2:#c4d8c4;--grid:#bcd0b8;}
html[data-go-scene="stone"]{--paper:#f3f4f2;--line:#e1e4e1;--line-2:#cbd0cd;--grid:#c3cac6;}
html[data-go-scene="sky"]{--paper:#f2f8fc;--line:#dfebf3;--line-2:#c7dce9;--grid:#c2d6e4;}
html[data-go-scene="paper"] #room,html[data-go-scene="paper"] #join{
  background-image:repeating-linear-gradient(0deg,rgba(150,120,70,.028) 0 1px,transparent 1px 5px),
    radial-gradient(700px 400px at 50% -10%,rgba(230,205,160,.28),transparent 70%);}
html[data-go-scene="bamboo"] #room,html[data-go-scene="bamboo"] #join{
  background-image:
    repeating-linear-gradient(93deg,transparent 0 108px,rgba(64,120,72,.055) 108px 120px,transparent 120px 286px),

   旧写法在真机上有三个死角，实测 14 个设备条件里 5 个失败：
     ① 面板贴 bottom:0，内容没超高时 maxScroll=0，底部「完成」与
        「网格线」被地址栏 / 工具栏盖住，用户连滚都滚不动；

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let PID = localStorage.getItem('wx_pid');
if (!PID) { PID = 'u' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('wx_pid', PID); }

const N = 15;
let CODE = '', ME = '', MYSEAT = -1, STATE = null, es = null, pollT = null, peerOnline = false, CHAT = [];
let askKey = null, lastEndKey = '';

/* ---------------- 小工具 ---------------- */
function toast(msg, ms) {
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), ms || 2200);
}

/* ================= 背景音乐（现场合成，安静的思考感 loop） ================= */
const MUSIC = (() => {
  const GA = window.WNAV_AUDIO;   // 全站统一的音量 / 静音 / 点击音效设置
  let ctx, master, reverb, sfx, on = false, wants = GA ? !GA.muted : false, timer = null, scene = 'menu';
  let vol = GA ? GA.vol : 1, pendingVictory = false, victoryPlayed = 0, resumeHooked = false;
  const SCALE = [0, 3, 5, 7, 10, 12];      // 小调五声 + 八度
  const ROOT = 196;                         // G3
  function makeReverb() {
    const len = Math.floor(ctx.sampleRate * 1.8);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    const c = ctx.createConvolver(); c.buffer = buf; return c;
  }
  function build() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.0001;
    reverb = makeReverb();
    const revGain = ctx.createGain(); revGain.gain.value = 0.5;
    master.connect(ctx.destination); master.connect(reverb); reverb.connect(revGain); revGain.connect(ctx.destination);
    // 胜利小曲单独一条增益，方便和背景循环分别控制
    sfx = ctx.createGain(); sfx.gain.value = Math.max(0.0001, vol);
    sfx.connect(ctx.destination); sfx.connect(reverb);
    return true;
  }
  function tone(freq, t, dur, type, v, dest) {
    const o = ctx.createOscillator(); o.type = type || 'triangle'; o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, v || 0.18), t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + dur + 0.05);
  }
  function pad(t) {
    const base = ROOT / 2;
    [base, base * 1.5, base * 2].forEach(f => tone(f, t, 4.4, 'sine', 0.05));
  }
  function arp(t) {
    const oct = scene === 'play' ? 2 : 1;
    const step = SCALE[Math.floor(Math.random() * SCALE.length)];
    tone(ROOT * oct * Math.pow(2, step / 12), t, 1.7, 'triangle', scene === 'play' ? 0.16 : 0.12);
    if (Math.random() < 0.5) {
      const s2 = SCALE[Math.floor(Math.random() * SCALE.length)];
      tone(ROOT * oct * Math.pow(2, s2 / 12), t + 0.55, 1.2, 'sine', 0.07);
    }
  }
  function loop() {
    if (!on) return;
    const t = ctx.currentTime;
    arp(t);
    if (Math.random() < 0.5) pad(t);
    timer = setTimeout(loop, 1400 + Math.random() * 600);
  }
  function fade(to, sec) {
    if (!master) return;
    const n = ctx.currentTime;
    const target = Math.max(0.0001, to * vol);
    master.gain.cancelScheduledValues(n);
    master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), n);
    master.gain.exponentialRampToValueAtTime(target, n + sec);
  }
  function start() {
    if (!wants) return;
    if (!ctx && !build()) return;
    if (ctx.state === 'suspended') { const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
    on = true; fade(0.2, 0.8); if (!timer) loop();
  }
  function stop() { on = false; if (timer) { clearTimeout(timer); timer = null; } if (master) fade(0.0001, 0.5); }
  function toggle() {
    wants = GA ? !GA.toggleMute() : !wants;   // 静音状态全站共用一份
    if (wants) start(); else stop();
    return wants;
  }
  /* 胜利小曲：C 大调五声、慢速、只用 sine / 三角波，配一段低音铺底（约 11 秒，放完即止） */
  const VICTORY_NOTES = [
    [0.0, 130.81, 4.2, 'sine', 0.045],
    [4.4, 196.00, 3.4, 'sine', 0.04],
    [7.4, 130.81, 3.0, 'sine', 0.04],
    [0.0, 523.25, 1.1, 'sine', 0.07],
    [0.55, 659.25, 1.0, 'sine', 0.055],
    [1.10, 783.99, 1.3, 'sine', 0.065],
    [1.95, 659.25, 1.2, 'sine', 0.055],
    [2.60, 587.33, 1.2, 'sine', 0.05],
    [3.20, 523.25, 1.8, 'sine', 0.07],
    [4.40, 392.00, 1.4, 'sine', 0.05],
    [4.90, 440.00, 1.2, 'sine', 0.05],
    [5.50, 392.00, 1.4, 'sine', 0.05],
    [6.10, 329.63, 1.2, 'sine', 0.05],
    [6.80, 293.66, 1.2, 'sine', 0.045],
    [7.40, 261.63, 2.2, 'sine', 0.06],
    [8.90, 392.00, 1.6, 'sine', 0.04],
    [9.20, 523.25, 2.2, 'sine', 0.06]
  ];
  function playVictoryTheme() {
    victoryPlayed++;
    const t = ctx.currentTime + 0.2;
    for (const [dt, f, dur, type, v] of VICTORY_NOTES) tone(f, t + dt, dur, type, v, sfx);
  }
  function victory() {
    if (!wants) { pendingVictory = false; return; }   // 静音时不出声
    if (!ctx) { pendingVictory = true; return; }      // 用户还没交互：不提前创建 AudioContext
    if (ctx.state === 'running') {
      pendingVictory = false;
      try { playVictoryTheme(); } catch (e) { /* 音频出问题不影响棋局 */ }
      return;
    }
    /* 还没拿到播放许可（未交互）：挂起，等 ctx 恢复后再放，避免自动播放报错 */
    pendingVictory = true;
    if (resumeHooked) return;
    resumeHooked = true;
    const done = () => {
      resumeHooked = false;
      if (pendingVictory && ctx.state === 'running') {
        pendingVictory = false;
        try { playVictoryTheme(); } catch (e) {}
      }
    };
    const p = ctx.resume ? ctx.resume() : null;
    if (p && p.then) p.then(done).catch(() => { resumeHooked = false; });
    else done();
  }
  function setVol(v) {
    vol = GA ? GA.setVol(v) : Math.max(0, Math.min(1, Number(v) || 0));
    if (ctx) { if (on) fade(0.2, 0.25); if (sfx) sfx.gain.setValueAtTime(Math.max(0.0001, vol), ctx.currentTime); }
    return vol;
  }
  return {
    get on() { return on; }, get wants() { return wants; }, get vol() { return vol; },
    get victoryPlayed() { return victoryPlayed; },
    init() {
      if (GA) { wants = !GA.muted; vol = GA.vol; }
    },
    persist() {},   // 音量 / 静音由 audio.js 统一持久化
    toggle, start, stop, victory, setVol, setScene(s) { scene = s; },
    applySettings(st) {

  for (let i = 0; i < N * N; i++) {

else $('nameIn').value = localStorage.getItem('wx_name') || '';
$('roomIn').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9_-]/g, ''); });
$('roomIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('nameIn').focus(); });
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') enterRoom(); });
$('randBtn').addEventListener('click', () => {
  const s = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = ''; for (let i = 0; i < 5; i++) c += s[Math.floor(Math.random() * s.length)];
  $('roomIn').value = c; $('nameIn').focus();
});
$('enterBtn').addEventListener('click', enterRoom);
function joinMsg(t, ok) { const el = $('joinMsg'); el.textContent = t; el.className = 'jmsg' + (ok ? ' ok' : ''); }

async function enterRoom() {
  const code = $('roomIn').value.trim().toUpperCase();
  const name = $('nameIn').value.trim() || '我';
  if (!code) return joinMsg('先填个房间号，或者点「随机开一间」');
  $('enterBtn').disabled = true; joinMsg('正在连接…', true);
  let r;
  try {
    r = await fetch('/api/go/enter', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, name, pid: PID }) }).then(x => x.json());
  } catch (e) { $('enterBtn').disabled = false; return joinMsg('连不上服务器，检查一下网络'); }
  if (r.error) { $('enterBtn').disabled = false; return joinMsg(r.error); }

  CODE = r.code; ME = r.name; MYSEAT = r.seat;
  localStorage.setItem('wx_name', ME);
  history.replaceState(null, '', '/gomoku?room=' + encodeURIComponent(CODE));

  $('join').classList.add('hidden');
  $('room').classList.remove('hidden');
  $('codeTxt').textContent = CODE;
  $('enterBtn').disabled = false;
  applyState(r);
  updatePeer(r.peer, r.members);
  connect();
  paintBgm();
  /* 不在这里自动起音频：等用户第一次点击再启动，避免被浏览器自动播放策略拦截 */
}

/* ---------------- 实时 ---------------- */
function connect() {
  if (es) { try { es.close(); } catch (e) {} }
  if (pollT) { clearInterval(pollT); pollT = null; }
  es = new EventSource('/api/go/stream?code=' + encodeURIComponent(CODE) + '&pid=' + encodeURIComponent(PID));
  es.addEventListener('hello', e => {
    const d = JSON.parse(e.data); MYSEAT = d.seat; applyState(d.view); updatePeer(d.peer);
  });
  es.addEventListener('board', e => { applyState(JSON.parse(e.data)); });
  es.addEventListener('peer', e => updatePeer(JSON.parse(e.data).peer));
  es.addEventListener('rule', e => {
    const d = JSON.parse(e.data); if (!STATE) return;
    Object.assign(STATE, { rule: d.rule, ruleLocked: d.locked, blackSeat: d.blackSeat, hostSeat: d.hostSeat, swapPending: d.swapPending, hostReq: d.hostReq, rps: d.rps });
    applyState(STATE);
  });
  es.addEventListener('chat', e => { const d = JSON.parse(e.data); if (Array.isArray(d)) chatAll(d); else chatPush(d); });
  es.addEventListener('rps', e => {
    const d = JSON.parse(e.data);
    if (!STATE) return;
    STATE.rps = d.state || { a: null, b: null };
    if (d.tie) { toast('平局，请重新出拳'); }
    else if (d.winner != null && d.winner !== -1) {
      STATE.blackSeat = d.winner;
      toast(d.winner === MYSEAT ? '猜拳你赢了，执黑先手' : '对方赢猜拳，对方执黑先手', 2600);
    }
    renderRps(); renderRule(); renderIdentity();
  });
  es.addEventListener('host', e => { const d = JSON.parse(e.data); if (STATE) STATE.hostSeat = d.hostSeat; renderIdentity(); renderRule(); });
  es.addEventListener('swap', e => {
    const d = JSON.parse(e.data); if (STATE) STATE.swapPending = d.pending; renderRule();
    if (d.pending && MYSEAT === STATE.hostSeat) askModal('交换先后手申请', (d.from || '对方') + ' 申请交换先后手（交换后你执白）', () => act('respondSwap', { yes: true }), () => act('respondSwap', { yes: false }));
  });
  es.addEventListener('hostreq', e => {
    const d = JSON.parse(e.data); if (STATE) STATE.hostReq = d.pending; renderRule();
    if (d.pending && MYSEAT === STATE.hostSeat) askModal('房主身份申请', (d.from || '对方') + ' 申请成为房主', () => act('respondHost', { yes: true }), () => act('respondHost', { yes: false }));
  });
  es.addEventListener('rulereq', e => {
    const d = JSON.parse(e.data); if (!STATE) return;
    if (MYSEAT === STATE.hostSeat) { const want = d.want === 'random' ? '随机分配先后手' : '猜拳定先后手'; askModal('规则邀请', (d.from || '对方') + ' 邀请采用「' + want + '」', () => act('respondRule')); }
  });
  es.addEventListener('undo', e => {
    const d = JSON.parse(e.data);
    if (!STATE) return;
    STATE.undoPending = d.pending ? { seat: d.seat, name: d.from, at: Date.now() } : null;
    renderUndoBar(); updateStatus(STATE);
    if (d.pending) {
      if (d.seat === MYSEAT) { toast('悔棋请求已发出，等对方确认（15 秒无响应自动取消）', 2600); return; }
      askModal('悔棋请求', '「' + (d.from || '对方') + '」想撤回最近一手。同意后棋盘、落子记录、胜负与回合都会一起回退。',
        () => act('respondUndo', { yes: true }), () => act('respondUndo', { yes: false }), 'undo');
      return;
    }
    if (askKey === 'undo') closeAsk();
    if (d.canceled) { if (d.seat === MYSEAT) toast('已取消悔棋请求'); return; }
    if (d.timeout) { toast(d.seat === MYSEAT ? '对方没有回应，悔棋请求已超时取消' : '悔棋请求已超时取消', 2600); return; }
    if (d.yes) {
      toast(d.seat === MYSEAT
        ? '对方同意了，退回 ' + (d.removed || 1) + ' 手，轮到你重新落子'
        : '已同意对方悔棋，退回 ' + (d.removed || 1) + ' 手', 2600);
    } else {
      toast(d.seat === MYSEAT ? '对方拒绝了悔棋请求' : '已拒绝对方的悔棋请求');
    }
  });
  es.addEventListener('ready', e => {
    const d = JSON.parse(e.data);
    if (!STATE) return;
    STATE.ready = d.ready || [false, false];
    renderVictory();
    if (d.started) toast('双方都已准备，新一局开始', 2200);
  });
  es.onerror = () => { if (!pollT) pollT = setInterval(pollOnce, 3000); };
  es.onopen = () => { if (pollT) { clearInterval(pollT); pollT = null; } };
}
async function pollOnce() {
  try {
    const r = await fetch('/api/go/state?code=' + encodeURIComponent(CODE) + '&pid=' + encodeURIComponent(PID)).then(x => x.json());
    if (r.needJoin) return;
    applyState(r.view); updatePeer(r.peer);
  } catch (e) {}
}
function updatePeer(peer, members) {
  const on = !!(peer && peer.online);
  peerOnline = on;
  $('peerDot').classList.toggle('on', on);
  $('peerTxt').textContent = peer
    ? (peer.name + (on ? ' 在线' : ' 离线中'))
    : (members && members.length ? '等待对方进入…' : '等待对方进入…');
  paintHot();
  if (STATE) { updateStatus(STATE); renderVictory(); }
}

/* ---------------- 落子 / 重开 ---------------- */
async function place(x, y) {
  if (!STATE) return;
  if (STATE.winner !== -1) return toast('本局已结束，点「准备下一局」');
  if (STATE.turn !== MYSEAT) return toast('还没轮到你');
  if (STATE.board[y * N + x] !== -1) return toast('这里已经有子了');
  const r = await fetch('/api/go/move', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: CODE, pid: PID, x, y }) }).then(x => x.json());
  if (r.error) return toast(r.error);
  applyState(r);
}
$('restartBtn').addEventListener('click', async () => {
  if ($('restartBtn').disabled) return;
  try {
    const r = await fetch('/api/go/restart', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, pid: PID }) }).then(x => x.json());
    if (r.error) return toast(r.error);
    applyState(r);
  } catch (e) { toast('重开失败，检查网络'); }
});

/* ---------------- 邀请 ---------------- */
$('infoBtn').addEventListener('click', async () => {
  const link = location.origin + '/gomoku?room=' + encodeURIComponent(CODE);
  try { await navigator.clipboard.writeText(link); toast('邀请链接已复制，发给对方就行'); }
  catch (e) { prompt('复制这个链接发给对方：', link); }
});

/* ---------------- 进页面自动填 ---------------- */
if (qs.get('room') && $('nameIn').value) enterRoom();
else if (qs.get('room')) $('nameIn').focus();
else $('roomIn').focus();
window.addEventListener('beforeunload', () => { if (es) try { es.close(); } catch (e) {} });
</script>
<script>
/* ============================================================
   v5 · 五子棋「设置 · 场景与棋盘」（独立 IIFE，纯增量）
   ============================================================ */
(function goSettings(){
  'use strict';
  var $ = function(s){return document.querySelector(s);};
  var $$ = function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
  function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem(k,v);}catch(e){}}

  var SCENES = [
    {k:'white', n:'纯白', sw:'background:linear-gradient(180deg,#fff,#f4f4f2)'},
    {k:'paper', n:'宣纸', sw:'background:linear-gradient(180deg,#fbf7ef,#eee0c8)'},
    {k:'bamboo',n:'竹林', sw:'background:repeating-linear-gradient(93deg,#eaf3e7 0 8px,#cfe3c8 8px 11px,#eaf3e7 11px 22px)'},
    {k:'stone', n:'石庭', sw:'background:linear-gradient(135deg,#e6e9e6,#c3cac6)'},
    {k:'sky',   n:'天青', sw:'background:linear-gradient(180deg,#eaf5fd,#cfe4f2)'}
  ];
  var BOARDS = [
    {k:'plain',   n:'素白', sw:'background:linear-gradient(135deg,#fff,#eee);'},
    {k:'wood',    n:'原木', sw:'background:linear-gradient(135deg,#efd2a6,#d3a56d)'},
    {k:'stone',   n:'石台', sw:'background:linear-gradient(135deg,#e0e4e0,#b9c1bd)'},
    {k:'celadon', n:'青瓷', sw:'background:linear-gradient(135deg,#e2f1ec,#a9cfc4)'},
    {k:'ink',     n:'墨玉', sw:'background:linear-gradient(135deg,#3b464b,#1c2529)'}
  ];
  var LINES = [{k:'light',n:'淡'},{k:'normal',n:'标准'},{k:'deep',n:'浓'}];
  var scene = ls('go_scene','white'), board = ls('go_board','plain'), line = ls('go_line','normal');
  if (!SCENES.some(function(x){return x.k===scene;})) scene='white';
  if (!BOARDS.some(function(x){return x.k===board;})) board='plain';
  if (!LINES.some(function(x){return x.k===line;})) line='normal';

  function apply(){
    document.documentElement.dataset.goScene = scene;
    document.documentElement.dataset.goBoard = board;
    document.documentElement.dataset.goLine  = line;
    save('go_scene',scene);save('go_board',board);save('go_line',line);
    $$('#goSceneOpts .goset-opt').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===scene?'true':'false');});
    $$('#goBoardOpts .goset-opt').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===board?'true':'false');});
    $$('#goLineOpts button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k===line?'true':'false');});
  }

  /* 顶栏新增设置按钮，插在 ♪ 前面，不动任何原有按钮 */
  var bgm = $('#bgmBtn');
  if (bgm) bgm.insertAdjacentHTML('beforebegin',
    '<button class="hbtn goset-btn" id="goSetBtn" title="设置：场景与棋盘" aria-label="设置">⚙</button>');

  var html =
    '<div class="goset-mask hidden" id="goSetMask"></div>' +
    '<div class="goset-panel hidden" id="goSetPanel" role="dialog" aria-modal="true" aria-labelledby="goSetTitle" tabindex="-1">' +
      '<div class="goset-h"><h2 id="goSetTitle">⚙ 棋局设置</h2><button class="x" id="goSetX" aria-label="关闭">✕</button></div>' +
      '<p class="goset-sub">换个下棋的地方。设置只记在这台设备，刷新、重开一局都还在；棋子与规则一点不变。</p>' +
      '<div class="goset-row"><label>场景背景<small>竹林、宣纸、石庭……都是纯 CSS 画的，不加载图片</small></label>' +
        '<div class="goset-opts" id="goSceneOpts">' + SCENES.map(function(x){
          return '<button class="goset-opt" data-k="'+x.k+'" aria-pressed="false"><span class="sw" style="'+x.sw+'"></span>'+x.n+'</button>';
        }).join('') + '</div></div>' +
      '<div class="goset-row"><label>棋盘材质<small>原木温软、石台清冷、青瓷润、墨玉压得住黑子</small></label>' +
        '<div class="goset-opts" id="goBoardOpts">' + BOARDS.map(function(x){
          return '<button class="goset-opt" data-k="'+x.k+'" aria-pressed="false"><span class="sw" style="'+x.sw+'"></span>'+x.n+'</button>';
        }).join('') + '</div></div>' +
      '<div class="goset-row"><label>网格线深浅<small>只影响棋盘线，不影响棋子与判定</small></label>' +
        '<div class="goset-line" id="goLineOpts">' + LINES.map(function(x){
          return '<button data-k="'+x.k+'" aria-pressed="false">'+x.n+'</button>';
        }).join('') + '</div></div>' +
      '<p class="goset-note">背景音乐和音量还是用顶栏的 ♪ 与首页设置，两边共用一套开关。</p>' +
      '<button class="goset-done" id="goSetDone">完成</button>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  apply();

  var mask = $('#goSetMask'), panel = $('#goSetPanel');
  function open(){mask.classList.remove('hidden');panel.classList.remove('hidden');panel.focus();}
  function close(){mask.classList.add('hidden');panel.classList.add('hidden');}
  var btn = $('#goSetBtn');
  if (btn) btn.addEventListener('click', open);
  $('#goSetX').addEventListener('click', close);
  $('#goSetDone').addEventListener('click', close);
  mask.addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });

  $('#goSceneOpts').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.goset-opt') : null;
    if(!b) return; scene = b.dataset.k; apply();
  });
  $('#goBoardOpts').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.goset-opt') : null;
    if(!b) return; board = b.dataset.k; apply();
  });
  $('#goLineOpts').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-k]') : null;
    if(!b) return; line = b.dataset.k; apply();
  });
})();
</script>
</body>
