<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>登录 · 和鱼的开心导航</title>
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="logo">和</span><b>和鱼的开心导航</b>
    <a class="back" href="/">← 回大厅</a>
  </div>

  <div class="card">
    <h1>登录</h1>
    <p class="lead">账号填 ID（如 0001）或昵称都行。登录后「与鱼」就是你自己那一间屋。</p>

    <label class="f" for="account">账号</label>
    <input class="f" id="account" placeholder="ID 或昵称" autocomplete="username" autofocus>

    <label class="f" for="pass">密码</label>
    <input class="f" id="pass" type="password" placeholder="密码" autocomplete="current-password">

    <button class="btn" id="go">登录</button>
    <div class="msg" id="msg"></div>

    <div class="foot-note">还没有账号？<a href="/register.html">去注册</a></div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var next=new URLSearchParams(location.search).get('next')||'';
  /* 只允许站内路径，且不能是 //evil.com 这种协议相对地址 */
  if(next.indexOf('/')!==0||next.indexOf('//')===0||next.indexOf('/\\')===0)next='';
  function msg(t,bad){var el=$('msg');el.textContent=t;el.className='msg'+(bad?' bad':'');}
  async function go(){
    var account=$('account').value.trim(), pass=$('pass').value;
    if(!account||!pass){msg('账号和密码都要填',1);return;}
    $('go').disabled=true;msg('正在登录…');
    try{
      var r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
        credentials:'same-origin',body:JSON.stringify({account:account,pass:pass})}).then(function(x){return x.json();});
      if(r.error){msg(r.error,1);$('go').disabled=false;return;}
      location.href=next&&next.charAt(0)==='/'?next:'/';
    }catch(e){msg('连不上服务器，稍后再试',1);$('go').disabled=false;}
  }
  $('go').onclick=go;
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!$('go').disabled)go();});
  /* 已登录就直接走 */
  fetch('/api/auth/me',{credentials:'same-origin'}).then(function(x){return x.json();}).then(function(me){
    if(me&&me.ok)location.replace(next&&next.charAt(0)==='/'?next:'/');
  }).catch(function(){});
})();
</script>
</body>
</html>
